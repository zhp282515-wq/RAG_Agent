<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元知万象 · 智能知识助手</title>
<link rel="stylesheet" href="/static/css/style.css?v=28">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
<!-- 背景模糊层(壁纸照片经强高斯模糊后置于最底层) -->
<div id="bg-blur"></div>

<!-- ===== 线性 SVG 图标库(24x24 stroke 风格,颜色随 currentColor) ===== -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
  <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></symbol>
  <symbol id="i-clipboard" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
  <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></symbol>
  <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/><line x1="4" y1="9" x2="7" y2="9"/><line x1="4" y1="12" x2="7" y2="12"/><line x1="4" y1="15" x2="7" y2="15"/></symbol>
</svg>

<div id="app">

  <!-- ============ 顶栏 ============ -->
  <header id="topbar" class="edge-lit">
    <div class="topbar-left">
      <button class="icon-btn" id="btn-sidebar-toggle" title="折叠/展开会话栏"><svg class="ic" id="sidebar-toggle-ic"><use href="#i-sidebar"/></svg></button>
      <span class="brand-logo"></span>
      <span class="brand">知识库助手</span>
      <nav id="tabs">
        <button class="tab active" data-view="chat">会话</button>
        <button class="tab" data-view="docs">知识库</button>
        <button class="tab" data-view="debug">检索调试</button>
        <button class="tab" data-view="report">报告</button>
      </nav>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="btn-search" title="搜索(装饰)"><svg class="ic"><use href="#i-search"/></svg></button>
      <button class="icon-btn" id="btn-bell" title="通知(装饰)"><svg class="ic"><use href="#i-bell"/></svg></button>
      <button class="icon-btn" id="btn-theme" title="深色/浅色切换"><svg class="ic" id="theme-ic"><use href="#i-moon"/></svg></button>
      <div class="avatar" id="avatar-wrap" title="用户菜单(装饰)">
        <span class="avatar-circle">张</span>
        <span class="avatar-name">test8</span>
        <svg class="ic ic-sm"><use href="#i-chevron-down"/></svg>
        <div class="avatar-menu hidden">
          <button id="btn-wallpaper">更换壁纸</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ============ 主体 ============ -->
  <div id="body">

    <!-- 左侧边栏(会话) -->
    <aside id="sidebar" class="edge-lit">
      <button id="btn-new-session" class="btn-liquid"><svg class="ic"><use href="#i-plus"/></svg> 新建会话</button>
      <div class="session-search">
        <svg class="ic ic-sm"><use href="#i-search"/></svg>
        <input type="text" id="session-search-input" placeholder="搜索会话">
      </div>
      <div id="session-list"></div>
      <div id="sidebar-user">
        <span class="avatar-circle">张</span>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">test8</div>
          <div class="sidebar-user-plan">专业版</div>
        </div>
        <div class="settings-menu-wrap">
          <button class="icon-btn" id="btn-settings" title="设置" onclick="App.toggleSettingsMenu(event)"><svg class="ic"><use href="#i-gear"/></svg></button>
          <div id="settings-menu" class="dropdown-menu hidden">
            <button class="dropdown-item" onclick="App.openAppearance(event)"><svg class="ic ic-sm"><use href="#i-sun"/></svg> 外观设置</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- 右侧内容区 -->
    <main id="content" class="edge-lit">

      <!-- ===== 会话页(聊天) ===== -->
      <section class="view active" id="view-chat">
        <div id="chat-area">
          <div id="chat-messages">
            <div id="chat-welcome" class="welcome">
              <h2>你好</h2>
              <p>我是你的知识库助手,基于已接入知识库,为你提供准确、可靠的信息检索与分析。</p>
            </div>
          </div>
          <div id="chat-input-wrap">
            <div id="chat-docs-preview"></div>
            <div id="chat-images-preview"></div>
            <div id="chat-input-box" class="edge-lit">
              <div class="input-tools">
                <button class="tool-btn" id="btn-img-pick" title="上传图片"><svg class="ic"><use href="#i-image"/></svg></button>
                <button class="tool-btn" id="btn-file-pick" title="上传文档"><svg class="ic"><use href="#i-paperclip"/></svg></button>
              </div>
              <textarea id="chat-input" rows="1" placeholder="输入你的问题,Enter 发送,Shift+Enter 换行"></textarea>
              <div id="model-picker" class="model-picker" title="选择对话模型">
                <button id="model-picker-btn" class="model-picker-btn" type="button">
                  <span id="model-picker-label">加载中…</span>
                  <svg class="ic ic-xs mp-arrow"><use href="#i-chevron-down"/></svg>
                </button>
                <div id="model-picker-menu" class="model-picker-menu hidden"></div>
              </div>
              <button id="btn-send" class="btn-liquid" title="发送"><svg class="ic"><use href="#i-send"/></svg></button>
              <input type="file" id="img-file-input" accept="image/*" multiple hidden>
              <input type="file" id="doc-file-input-chat" accept=".pdf,.docx,.doc,.txt,.md,.markdown,.csv,.xlsx,.xls" multiple hidden>
            </div>
          </div>
        </div>

        <!-- 工作流面板(聊天右侧) -->
        <div id="workflow-panel" class="edge-lit">
          <div class="wf-header">
            <span><svg class="ic ic-sm"><use href="#i-gear"/></svg> 工作流</span>
            <button id="btn-wf-toggle" title="收起/展开"><svg class="ic ic-sm"><use href="#i-chevron-right"/></svg></button>
          </div>
          <div id="workflow-steps"><div class="wf-empty">暂无执行记录</div></div>
        </div>
      </section>

      <!-- ===== 知识库页(文档管理) ===== -->
      <section class="view" id="view-docs">
        <div class="page-head">
          <h2>知识库</h2>
          <div class="upload-wrap">
            <button id="btn-upload" class="btn-liquid"><svg class="ic"><use href="#i-upload"/></svg> 上传文档</button>
            <input type="file" id="doc-file-input" hidden
                   accept=".pdf,.docx,.doc,.txt,.md,.markdown,.csv,.xlsx,.xls">
          </div>
        </div>
        <p id="upload-status" class="muted"></p>
        <div class="doc-toolbar">
          <div class="doc-filters" id="doc-filters"></div>
          <div class="doc-search">
            <svg class="ic ic-sm"><use href="#i-search"/></svg>
            <input type="text" id="doc-search-input" placeholder="搜索文件名…">
          </div>
        </div>
        <table id="docs-table">
          <thead>
            <tr><th>文件名</th><th>格式</th><th>大小</th><th>分片数</th><th>操作</th></tr>
          </thead>
          <tbody id="docs-tbody"></tbody>
        </table>
      </section>

      <!-- ===== 检索调试页 ===== -->
      <section class="view" id="view-debug">
        <div class="page-head"><h2>检索调试</h2></div>
        <div class="debug-form">
          <input type="text" id="debug-query" placeholder="输入检索 query">
          <input type="number" id="debug-topk" value="20" min="1" max="100" title="top_k">
          <button id="btn-debug-search" class="btn-liquid">检索</button>
        </div>
        <div id="debug-results"></div>
      </section>

      <!-- ===== 报告页 ===== -->
      <section class="view" id="view-report">
        <div class="page-head"><h2>报告记录</h2></div>
        <div id="report-list"></div>
      </section>

    </main>
  </div>
</div>

<!-- 溯源记录弹窗 -->
<div id="sources-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span>溯源记录</span>
      <button id="btn-sources-close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div id="sources-modal-body"></div>
  </div>
</div>

<!-- 单条回答工作流弹窗 -->
<div id="wf-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span><svg class="ic ic-sm"><use href="#i-activity"/></svg> 该回答的工作流</span>
      <button id="btn-wf-modal-close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div id="wf-modal-body"></div>
  </div>
</div>

<!-- 文档预览弹窗 -->
<div id="doc-preview-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span id="doc-preview-title">文档预览</span>
      <button id="btn-doc-preview-close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div id="doc-preview-body" class="doc-preview-body"></div>
  </div>
</div>

<!-- 报告预览/编辑弹窗 -->
<div id="report-modal" class="modal hidden">
  <div class="modal-box report-modal-box">
    <div class="modal-head">
      <span id="report-modal-title">报告预览</span>
      <div>
        <button id="btn-report-edit-toggle"><svg class="ic ic-sm"><use href="#i-edit"/></svg> 编辑</button>
        <button id="btn-report-download"><svg class="ic ic-sm"><use href="#i-download"/></svg> 下载</button>
        <button id="btn-report-close"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div id="report-modal-preview" class="markdown-body"></div>
    <textarea id="report-modal-editor" class="hidden"></textarea>
    <div id="report-modal-footer" class="hidden">
      <button id="btn-report-save">保存</button>
      <button id="btn-report-cancel">取消</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-box" style="width: 440px;">
    <div class="modal-head">
      <span><svg class="ic ic-sm"><use href="#i-gear"/></svg> 外观设置</span>
      <button id="btn-settings-close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="setting-row">
        <span class="setting-label">界面模糊度</span>
        <span class="setting-value" id="glass-blur-val">20</span>
      </div>
      <input type="range" id="glass-blur-slider" min="0" max="40" step="1" value="20" class="slider-full">
      <p class="setting-hint">控制玻璃面板与背景的模糊强度,0 为完全清晰。</p>
    </div>
  </div>
</div>

<script src="/static/js/api.js?v=3"></script>
<script src="/static/js/app.js?v=4"></script>
<script src="/static/js/sessions.js?v=4"></script>
<script src="/static/js/chat.js?v=15"></script>
<script src="/static/js/docs.js?v=6"></script>
<script src="/static/js/debug.js?v=2"></script>
<script src="/static/js/report.js?v=2"></script>
</body>
</html>
